<!-- ST-10 game-camera proof: qa3d lighting (Hemi 0x9fb4d8/0x2a2a30 0.55 + Dir 0xfff4e2 2.6 from (-30k,22k,18k)), ACES, sRGB, bg 0x05060b,

const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

// game GLB (st10b_game.glb / st10a_game.glb, same node names): no merging; one cradle node visible; optional sRGB lift of COLOR_0 (sweep only; final frames use the baked GLB)

    const c = m.geometry.attributes.color;

window.setup = async (o) => {

  const pad = await L.loadAsync(o.pad); PAD = pad.scene; scene.add(PAD); PAD.updateMatrixWorld(true);
  addRoad(29.4, 125);
  const tr = await L.loadAsync(o.trn); const M = o.game ? gameGLB(tr.scene, o) : mergeByMaterial(tr.scene); TRN = M.group; TRN.position.set(o.xt, 0, -13); scene.add(TRN);
  if (o.loaded) {   // clone the pad's own ship (Ship_Placeholder + Cargo_Door), lifted 0.45 m by the cradle jacks
    SHIP = new THREE.Group(); for (const n of ['Ship_Placeholder', 'Cargo_Door']) { const s = PAD.getObjectByName(n); if (s) { const c = s.clone(true); s.getWorldPosition(v); c.position.copy(v); c.quaternion.copy(s.getWorldQuaternion(new THREE.Quaternion())); SHIP.add(c); } }
    SHIP.position.set(o.xt, 0.45, 0); scene.add(SHIP);
  }
  { const s0 = PAD.getObjectByName('Ship_Placeholder'), c0 = PAD.getObjectByName('Cargo_Door'); if (o.loaded) { if (s0) s0.visible = false; if (c0) c0.visible = false; } }   // the ship left the pad
  return { draws: M.draws, draws_astronaut: M.draws_astronaut, tris: M.tris, names: M.names, calls: (renderer.info.reset(), 0) };
};
function pts(objs) { const a = []; for (const o of objs) { if (!o) continue; o.updateMatrixWorld(true); o.traverse(m => { if (!m.isMesh) return; const p = m.geometry.attributes.position; const st = Math.max(1, Math.floor(p.count / 40000));
  for (let i = 0; i < p.count; i += st) { v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld); a.push(v.x, v.y, v.z); } }); } return a; }

  for (let i = 0; i < P.length; i += 3) { v.set(P[i], P[i + 1], P[i + 2]).project(cam); const x = (v.x + 1) / 2 * w, y = (1 - v.y) / 2 * h; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); } return { x0, x1, y0, y1 }; }
// joint solve: one Cam_Target + frame_w that keeps transporter + ship inside both safe bands with >= 5 px spare (bands [x0,x1,y0,y1])
window.solve = (sizes, spare) => {

window.shot = (t, fw, band, label, bbox) => {

  if (bbox) { c.setLineDash([]); c.strokeStyle = 'rgba(58,208,255,0.9)'; c.strokeRect(bbox.x0, bbox.y0, bbox.x1 - bbox.x0, bbox.y1 - bbox.y0); }

// shaded-side p25: luminance (0..255, sRGB) of transporter pixels whose world normal faces away from the sun (N.L < 0.05)

  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, beauty = new Uint8Array(w * h * 4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, beauty);
